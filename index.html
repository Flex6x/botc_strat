<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trouble Brewing - Ultimate Role Guide</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --accent-purple: #a855f7;
            --accent-blue: #38bdf8;
            --accent-red: #f43f5e;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, #c084fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 1.5rem 1rem;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            z-index: 10;
            border-bottom: 1px solid var(--border-color);
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1.2rem;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: var(--card-hover);
        }

        .filter-btn.active {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: white;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }

        .search-box {
            width: 100%;
            max-width: 300px;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: white;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--accent-blue);
        }

        main {
            display: grid;
            grid-template-columns: minmax(280px, 350px) 1fr;
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        @media (max-width: 850px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .role-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .role-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .role-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .role-card.active {
            border-color: var(--accent-purple);
            background: var(--card-hover);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

        .role-card .icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .role-card.townsfolk .icon { background: rgba(56, 189, 248, 0.2); color: var(--accent-blue); }
        .role-card.outsider .icon { background: rgba(168, 85, 247, 0.2); color: var(--accent-purple); }
        .role-card.minion .icon { background: rgba(244, 63, 94, 0.2); color: var(--accent-red); }
        .role-card.demon .icon { background: rgba(239, 68, 68, 0.4); color: #ef4444; }

        .role-card .details {
            flex: 1;
        }

        .role-card h3 {
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }

        .role-card .type {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .guide-display {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            position: sticky;
            top: 80px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }

        .guide-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .guide-header h2 {
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .guide-header .badge {
            font-size: 0.8rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .badge.townsfolk { background: rgba(56, 189, 248, 0.2); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        .badge.outsider { background: rgba(168, 85, 247, 0.2); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
        .badge.minion { background: rgba(244, 63, 94, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .badge.demon { background: rgba(239, 68, 68, 0.3); color: #ef4444; border: 1px solid #ef4444; }

        .ability-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-left: 4px solid var(--accent-purple);
            border-radius: 0 8px 8px 0;
            margin-top: 1rem;
            font-style: italic;
            color: #e2e8f0;
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--accent-blue);
            margin: 1.5rem 0 0.75rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .guide-section {
            line-height: 1.6;
            color: #cbd5e1;
        }

        .guide-section ul {
            padding-left: 1.2rem;
            margin-bottom: 1rem;
        }

        .guide-section li {
            margin-bottom: 0.5rem;
        }

        .placeholder-text {
            text-align: center;
            color: var(--text-muted);
            padding: 4rem 1rem;
        }
    </style>
</head>

    <header>
        <h1>Trouble Brewing Role Guide</h1>
        <p>Interaktiver Strategieguide für Blood on the Clocktower. Wähle eine Rolle aus, um Taktiken, Bluff-Möglichkeiten und Konter zu sehen.</p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="Rolle suchen...">
        <button class="filter-btn active" onclick="filterRoles('all')">Alle</button>

        <button class="filter-btn" onclick="filterRoles('outsider')">Außenseiter</button>
        <button class="filter-btn" onclick="filterRoles('minion')">Handlanger</button>
        <button class="filter-btn" onclick="filterRoles('demon')">Dämon</button>

        </div>
    </main>

        function renderRoleList(roles) {
            const listEl = document.getElementById('roleList');
            listEl.innerHTML = '';
            roles.forEach(role => {
                const card = document.createElement('div');
                card.className = `role-card ${role.type}`;
                card.onclick = () => selectRole(role.id);
                card.id = `card-${role.id}`;

                let iconText = role.name.charAt(0);
                card.innerHTML = `
                    <div class="icon">${iconText}</div>
                    <div class="details">
                        <h3>${role.name}</h3>
                        <div class="type">${role.type}</div>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function selectRole(roleId) {
            document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
            const selectedCard = document.getElementById(`card-${roleId}`);
            if (selectedCard) selectedCard.classList.add('active');

            const role = rolesData.find(r => r.id === roleId);
            if (!role) return;

            const display = document.getElementById('guideDisplay');
            display.innerHTML = `
                <div class="guide-header">
                    <h2>${role.name} <span class="badge ${role.type}">${role.type}</span></h2>
                    <div class="ability-box">"${role.ability}"</div>
                </div>

                <div class="section-title">🎯 Wie du diese Rolle spielst</div>
                <div class="guide-section">
                    <ul>${role.play.map(item => `<li>${item}</li>`).join('')}</ul>
                </div>

                <div class="section-title">🎭 Bluff-Strategien (Gute & Böse)</div>
                <div class="guide-section">
                    <ul>${role.bluff.map(item => `<li>${item}</li>`).join('')}</ul>
                </div>

                <div class="section-title">🔍 Konter & Gegenstrategie (Lügen entlarven)</div>
                <div class="guide-section">
                    <ul>${role.counter.map(item => `<li>${item}</li>`).join('')}</ul>
                </div>
            `;
        }

        function filterRoles(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = rolesData.filter(r => {
                const matchesCat = category === 'all' || r.type === category;
                const matchesSearch = r.name.toLowerCase().includes(searchTerm);
                return matchesCat && matchesSearch;
            });
            renderRoleList(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = rolesData.filter(r => r.name.toLowerCase().includes(term));
            renderRoleList(filtered);
        });

        // Init
        renderRoleList(rolesData);
        if(rolesData.length > 0) selectRole(rolesData[0].id);
    </script>
